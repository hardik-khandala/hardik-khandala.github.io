<section class="min-h-[calc(100vh-8rem)] flex flex-col justify-center px-6 sm:px-10 md:px-16 py-12 md:py-16 max-w-4xl mx-auto">
  <div class="w-full flex flex-col gap-8">

    <!-- Top Status Badge -->
    <div appScrollReveal="left" [revealDelay]="100" class="inline-flex items-center gap-2.5 px-3.5 py-1.5 rounded-full bg-white/[0.04] border border-white/[0.08] backdrop-blur-md self-start shadow-sm hover:border-teal/30 transition-colors duration-300">
      <span class="flex h-2 w-2 relative">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-teal opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-teal"></span>
      </span>
      <span class="text-text-secondary text-xs font-medium tracking-wide">
        {{ hero.greeting }}
      </span>
    </div>

    <!-- Main Title & Name -->
    <div appScrollReveal="left" [revealDelay]="200" class="flex flex-col gap-2">
      <h1 class="text-text-primary font-extrabold text-4xl sm:text-5xl md:text-7xl tracking-tight leading-tight">
        {{ hero.name }}
      </h1>

      <!-- Dynamic Typewriter Role -->
      <div class="flex items-center gap-2.5 mt-1 min-h-[44px]">
        <span class="bg-gradient-to-r from-teal via-emerald-400 to-cyan-400 bg-clip-text text-transparent font-bold text-2xl sm:text-3xl md:text-4xl tracking-tight">
          {{ displayedText() }}
        </span>
        <span class="w-[3px] h-7 sm:h-9 bg-teal rounded-full animate-pulse shadow-[0_0_8px_rgba(0,245,184,0.8)]"></span>
      </div>
    </div>

    <!-- Bio Description -->
    <p appScrollReveal="left" [revealDelay]="300" class="text-text-secondary text-base sm:text-lg md:text-xl leading-relaxed max-w-2xl font-normal">
      {{ hero.description }}
    </p>

    <!-- CTAs & Action buttons -->
    <div appScrollReveal="up" [revealDelay]="400" class="flex flex-wrap items-center gap-4 pt-2">
      <!-- Primary Button -->
      <a [routerLink]="hero.cta.primary.url"
         class="group relative inline-flex items-center gap-2 px-7 py-3.5 rounded-xl font-semibold text-sm
                bg-teal text-[#06070a] shadow-[0_0_25px_rgba(0,245,184,0.35)]
                hover:shadow-[0_0_35px_rgba(0,245,184,0.55)] hover:scale-[1.02]
                active:scale-[0.98] transition-all duration-200 cursor-pointer overflow-hidden">
        <span class="relative z-10 font-bold tracking-tight">{{ hero.cta.primary.label }}</span>
        <i class="ti ti-arrow-right text-base relative z-10 group-hover:translate-x-1 transition-transform duration-200" aria-hidden="true"></i>
        <!-- Light sheen effect on hover -->
        <span class="absolute inset-0 -translate-x-full group-hover:translate-x-full transition-transform duration-700 bg-gradient-to-r from-transparent via-white/40 to-transparent"></span>
      </a>

      <!-- Secondary Liquid Glass Button -->
      <a [href]="hero.cta.secondary.url"
         target="_blank"
         rel="noopener noreferrer"
         class="inline-flex items-center gap-2 px-6 py-3.5 rounded-xl font-medium text-sm text-text-primary
                bg-white/[0.04] border border-white/[0.1] backdrop-blur-md
                hover:bg-white/[0.08] hover:border-teal/40 hover:text-teal
                hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 shadow-sm cursor-pointer">
        <i class="ti ti-file-download text-lg" aria-hidden="true"></i>
        <span>{{ hero.cta.secondary.label }}</span>
      </a>
    </div>

    <!-- Social Links & Capabilities Bar -->
    <div appScrollReveal="up" [revealDelay]="500" class="flex flex-col sm:flex-row sm:items-center justify-between gap-6 pt-6 border-t border-white/[0.06]">
      
      <!-- Social icons -->
      <div class="flex items-center gap-3">
        <span class="text-text-muted text-xs font-mono uppercase tracking-wider mr-1">Connect</span>
        @for (social of hero.social; track social.label) {
          <a [href]="social.url"
             target="_blank"
             rel="noopener noreferrer"
             [attr.aria-label]="social.label"
             class="w-10 h-10 rounded-xl bg-white/[0.03] border border-white/[0.08] flex items-center justify-center
                    text-text-secondary hover:text-teal hover:border-teal/40 hover:bg-teal/[0.08]
                    hover:scale-110 hover:shadow-[0_0_15px_rgba(0,245,184,0.2)]
                    transition-all duration-200">
            <i class="ti {{ social.icon }} text-lg" aria-hidden="true"></i>
          </a>
        }
      </div>

      <!-- Quick highlight tags -->
      <div class="flex items-center gap-2 flex-wrap">
        <span class="px-2.5 py-1 text-[11px] font-mono rounded-md bg-white/[0.03] border border-white/[0.06] text-text-muted">
          ⚡ High Performance
        </span>
        <span class="px-2.5 py-1 text-[11px] font-mono rounded-md bg-teal/[0.05] border border-teal/20 text-teal">
          🤖 AI Agents
        </span>
        <span class="px-2.5 py-1 text-[11px] font-mono rounded-md bg-purple/[0.05] border border-purple/20 text-purple">
          🌐 Full Stack
        </span>
      </div>

    </div>

  </div>
</section>
