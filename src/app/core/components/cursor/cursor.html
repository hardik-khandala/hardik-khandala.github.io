<div #spotlight class="fixed inset-0 pointer-events-none z-0 transition-opacity duration-300"></div>

<!-- Outer Smooth Follower Ring -->
<div #cursorRing class="custom-cursor-ring pointer-events-none fixed top-0 left-0 z-[9999] opacity-0"></div>

<!-- Center Precise Luminous Dot -->
<div #cursorDot class="custom-cursor-dot pointer-events-none fixed top-0 left-0 z-[10000] opacity-0"></div>
